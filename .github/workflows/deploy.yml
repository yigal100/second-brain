name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - okf

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout your actual vault/content into the root directory to preserve .git history
      - name: Checkout Content Source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetch all history for git info

      # 2. Checkout Quartz Tooling into a temporary folder
      - name: Checkout Quartz Tooling
        uses: actions/checkout@v7
        with:
          repository: yigal100/quartz
          ref: v5
          path: quartz-temp
          fetch-depth: 1 # History not needed for the tooling itself

      # 3. Sync Quartz tooling to root without overwriting your content's .git or custom config
      - name: Prepare Workspace
        run: |
          rsync -a --exclude='.git' --exclude='quartz.config.yaml' quartz-temp/ ./
          rm -rf quartz-temp

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Quartz plugins
        uses: actions/cache@v6
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-

      - name: Install Dependencies
        run: npm ci

      - name: Install Quartz plugins
        run: npx quartz plugin install

      # 4. Build directly targeting your content folder
      - name: Build Quartz
        run: npx quartz build -d "Second Brain"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
